<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Глобальная карта утечек</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌍 ГЛОБАЛЬНАЯ КАРТА УТЕЧЕК</h1>
    <p>Размер и цвет кругов показывают количество утечек по странам</p>
  </header>
  <div id="map"></div>
  <section class="checker">
    <h2>🔍 Проверить ваш email</h2>
    <div class="input-group">
      <input type="email" id="emailInput" placeholder="ivan@gmail.com">
      <button id="checkBtn">ПРОВЕРИТЬ</button>
    </div>
    <div id="result" style="margin-top:1rem;"></div>
  </section>
  <script src="app.js"></script>
</body>
</html>
